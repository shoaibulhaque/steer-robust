name: Validate instruction package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run package tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s dev -p 'test_*.py'
      - name: Validate and build distribution
        run: PYTHONDONTWRITEBYTECODE=1 python3 dev/build_package.py
